<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1120" viewBox="0 0 800 1120" role="img" aria-labelledby="arch-title arch-desc">
<title id="arch-title">Architecture of an evaluation trial</title><desc id="arch-desc">The authoring workbench publishes draft task versions so runs can include them. The evaluation engine selects a prompt template and a task. Harness extensions expose tools to the model inside the sandbox. The answer grader scores the submission. Project SQLite stores queryable run, trial, evidence, and grading records, with large artifacts kept in linked files.</desc>

